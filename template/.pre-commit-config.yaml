# Install once: pre-commit install --hook-type pre-commit --hook-type pre-push
# Project tools run through `uv run`, so their versions come from uv.lock and match CI.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: import-linter
        name: import contracts
        entry: uv run lint-imports
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
      # Slower or networked checks run once per push, on what is about to leave the machine.
      - id: pytest
        name: tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pip-audit
        name: known vulnerabilities
        entry: uv run pip-audit --skip-editable
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
