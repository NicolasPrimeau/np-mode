# np-mode starting point for a Python project. Rename `pkg` to the package name.

[project]
name = "pkg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.17",
  "mypy>=2.4",
  "pytest>=9",
  "slipcover>=1.0",
  "pytest-randomly>=3",
  "pytest-timeout>=2",
  "hypothesis>=6",
  "diff-cover>=9",
  "vulture>=2",
  "deptry>=0.23",
  "pip-audit>=2.10",
  "pre-commit>=4",
  "import-linter>=2",
  "crapper @ git+https://github.com/unclebob/crapper",
  "dryer @ git+https://github.com/NicolasPrimeau/dryer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP",  # style, pyflakes, imports, naming, modern syntax
  "B", "S", "BLE", "DTZ",         # bug patterns, security, blind except, naive datetimes
  "ANN", "T20", "ERA",            # types on every signature, no print, no commented-out code
  "C90", "PL", "SIM", "RET",      # complexity, pylint, simplify, returns
  "ARG", "PTH", "PT", "RUF",      # unused args, pathlib, pytest style, ruff's own
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # assert and literal expected values are what tests are

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = [
  "error",
  # slipcover runs pytest, so it is imported before pytest can rewrite its asserts. Harmless.
  "ignore:Module already imported so cannot be rewritten; slipcover:pytest.PytestAssertRewriteWarning",
]
timeout = 60  # pytest-timeout: a hung test fails instead of blocking the run

[tool.vulture]
# Run by hand, not as a hook: framework callbacks (routes, handlers) look unused at 60%.
paths = ["src"]  # not tests: fixtures requested only for their side effect look unused
min_confidence = 60

[tool.deptry]
known_first_party = ["pkg"]

[tool.importlinter]
root_package = "pkg"

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = ["pkg.cli", "pkg.domain"]
